<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f3d">
<title>SUBHA RIDE — Customer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#edf2ee;color:#18211c}
button,input{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}
.app{max-width:480px;min-height:100vh;margin:auto;background:#f9fbfa;padding-bottom:82px}
.top{height:78px;background:#fff;border-bottom:1px solid #e6ebe8;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}
.icon{width:42px;height:42px;border-radius:12px;font-size:22px}.brand{font-size:25px;font-weight:900;font-style:italic;letter-spacing:-1px}.brand b,.green{color:#087f3d}
.page{padding:20px 16px}.greet{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.muted{color:#626c66}.greet h1{font-size:27px;margin:3px 0}.greet p{margin:4px 0;color:#626c66}
.wallet{min-width:140px;background:#f1faf4;border:1px solid #d9ecdf;border-radius:15px;padding:11px;text-align:left}.wallet span,.wallet small{display:block;font-size:11px;color:#68736c}.wallet strong{display:block;font-size:22px;color:#087f3d;margin:5px 0}.wallet small{color:#087f3d;font-weight:bold}
.card{background:#fff;border:1px solid #e3e9e5;border-radius:18px;box-shadow:0 6px 20px #123b2010}
.location{padding:10px 13px;margin-bottom:23px}.field{min-height:82px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #edf0ee}.field:last-of-type{border:0}.dot{width:13px;height:13px;border-radius:50%;flex:none}.dot.g{background:#087f3d}.dot.r{border:3px solid #ef5947;background:#fff}.field label{font-size:12px;color:#606a64;display:flex;flex-direction:column;flex:1}.field input{border:0;outline:0;padding-top:6px;font-weight:700;font-size:15px;background:transparent;min-width:0}.field input::placeholder{color:#18211c}.locbtn{width:38px;height:38px;border-radius:50%;background:#eff8f2;color:#087f3d}
.quick{display:grid;grid-template-columns:1fr 1fr}.quick button{padding:15px 4px;color:#087f3d;font-weight:bold}.quick button+button{border-left:1px solid #edf0ee}
.title{display:flex;justify-content:space-between;align-items:center;margin:0 0 11px}.title h2{font-size:18px;margin:0}.title button{color:#087f3d;font-weight:bold}
.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.vehicle{position:relative;text-align:left;padding:12px;background:#fff;border:1.5px solid #e2e8e4;border-radius:17px}.vehicle.sel{border-color:#087f3d;box-shadow:0 5px 18px #087f3d18}.tick{position:absolute;right:8px;top:8px;background:#087f3d;color:#fff;width:25px;height:25px;border-radius:50%;display:grid;place-items:center}.truck{height:62px;display:grid;place-items:center;font-size:42px}.vehicle h3{font-size:16px;margin:4px 0}.vehicle p{font-size:11px;color:#68736c;min-height:29px;margin:0 0 10px}.meta{font-size:10px;color:#4f5953;line-height:1.6}.vfare{margin-top:10px;text-align:center;background:#eef8f1;color:#087f3d;border-radius:10px;padding:7px;font-size:17px;font-weight:bold}.vfare small{display:block;color:#68736c;font-size:9px;font-weight:normal}
.fare{padding:16px;margin-bottom:12px}.farehead{font-weight:bold;font-size:17px}.farebody{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.lines{flex:1}.lines p{display:flex;justify-content:space-between;border-bottom:1px dotted #cbd4ce;padding:6px 0;margin:0;font-size:12px;color:#68736c}.total{min-width:125px;border-left:1px solid #edf0ee;padding-left:12px;text-align:right}.total span,.total small{display:block;font-size:10px;color:#68736c}.total strong{display:block;color:#087f3d;font-size:25px;margin:4px}
.coupon{display:flex;align-items:center;gap:10px;padding:13px;background:#eff9f2;margin-bottom:10px}.gift{font-size:28px}.coupon div{flex:1}.coupon strong,.coupon span{display:block}.coupon strong{font-size:13px}.coupon span{font-size:11px;color:#68736c;margin-top:3px}.coupon button{color:#087f3d;font-weight:bold}
.couponinput{display:flex;background:#fff;border:1px solid #dfe7e1;border-radius:10px;margin-bottom:10px}.couponinput input{flex:1;border:0;outline:0;padding:11px}.book{width:100%;height:57px;background:#087f3d;color:#fff;border-radius:15px;font-size:18px;font-weight:bold}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:74px;background:#fff;border-top:1px solid #e3e9e5;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{font-size:10px;color:#69736d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.nav button.active{color:#087f3d;font-weight:bold}.nav b{font-size:20px;line-height:1}
.sub h1{font-size:27px}.back{color:#087f3d;font-weight:bold;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;padding:15px;margin-bottom:10px;width:100%;text-align:left}.row .grow{flex:1}.row small,.row p{display:block;color:#68736c;margin:4px 0;font-size:12px}.badge{font-size:10px;color:#087f3d}.empty{text-align:center;padding:45px 20px}.empty .big{font-size:45px}.profile{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:13px}.avatar{width:48px;height:48px;border-radius:50%;background:#dff1e5;color:#087f3d;display:grid;place-items:center;font-weight:bold}.modalbg{position:fixed;inset:0;background:#07150d80;z-index:30;display:grid;place-items:center;padding:17px}.modal{background:#fff;border-radius:23px;padding:25px;width:min(430px,100%);text-align:center}.success{width:60px;height:60px;background:#e6f6eb;color:#087f3d;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:30px}.modal .route{background:#f5f9f6;padding:13px;border-radius:12px;margin:14px 0;text-align:left;font-size:13px}.close{margin-top:10px;color:#087f3d;font-weight:bold}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#18211c;color:#fff;padding:11px 15px;border-radius:11px;z-index:50;font-size:12px;max-width:90%;text-align:center}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(150deg,#f5fbf7,#fff)}.loginbox{width:min(430px,100%);padding:25px}.loginbrand{text-align:center;font-size:31px;font-weight:900;font-style:italic}.loginbrand b{color:#087f3d}.loginbox h2{margin:28px 0 6px}.loginbox p{color:#68736c;font-size:13px}.loginbox input{width:100%;padding:14px;border:1px solid #dce6df;border-radius:12px;outline:none;margin:7px 0}.loginbox .book{margin-top:8px}.demo{font-size:11px;color:#68736c;margin-top:12px;text-align:center}
.mapbox{height:180px;border-radius:16px;background:repeating-linear-gradient(45deg,#f4f8f5,#f4f8f5 10px,#eaf2ec 10px,#eaf2ec 20px);display:grid;place-items:center;text-align:center;color:#68736c;margin-bottom:13px}.mapbox strong{display:block;color:#087f3d;font-size:28px}
@media(max-width:370px){.greet{display:block}.wallet{margin-top:10px;width:100%}.vehicles{grid-template-columns:1fr}.farebody{display:block}.total{border:0;border-top:1px solid #edf0ee;margin-top:8px;padding:10px 0;text-align:left}}
</style>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script></head>
<body><div id="app"></div>
<script>
"use strict";
const V=[{id:"mini",name:"Mini Truck",desc:"Best for heavy items delivery",cap:"Up to 1500 kg",load:"Large Load",fare:650,icon:"🚚"},{id:"tempo",name:"Tempo / Mini",desc:"Best for small load & shifting",cap:"Up to 750 kg",load:"Medium Load",fare:450,icon:"🚐"}];
const A={token:localStorage.getItem("subhaToken")||"",user:null,wallet:0,rides:[],page:"home",pickup:"",drop:"",vehicle:"mini",coupon:"",applied:false,notice:true,places:[]};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function api(path,opt={}){const o={...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}};if(A.token)o.headers.Authorization="Bearer "+A.token;const r=await fetch(path,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
async function boot(){if(!A.token){login();return}try{const m=await api("/api/me");A.user=m.user;A.wallet=m.wallet;const rs=await api("/api/rides");A.rides=rs.rides;const ps=await api("/api/saved-places");A.places=ps.places;render()}catch(e){localStorage.removeItem("subhaToken");A.token="";login()}}
function login(){document.getElementById("app").innerHTML=`<main class="login"><section class="loginbox card"><div class="loginbrand">SUBHA <b>RIDE</b></div><h2>Customer Login</h2><p>Enter your mobile number. OTP verification is required.</p><input id="phone" placeholder="+91 9876543210" inputmode="tel"><input id="name" placeholder="Your name (first login)" value="Customer"><button class="book" onclick="requestOtp()">Send OTP</button><div id="otpArea"></div><div class="demo">Development mode shows the OTP on screen. Connect an SMS provider before production.</div></section></main>`}
async function requestOtp(){try{const phone=document.getElementById("phone").value.trim(),name=document.getElementById("name").value.trim();const d=await api("/api/auth/request-otp",{method:"POST",body:JSON.stringify({phone})});document.getElementById("otpArea").innerHTML=`<input id="otp" placeholder="Enter 6-digit OTP" inputmode="numeric"><button class="book" onclick="verifyOtp('${esc(phone)}','${esc(name)}')">Verify & Continue</button>${d.demoOtp?`<p class="demo">Demo OTP: <b>${esc(d.demoOtp)}</b></p>`:""}`;toast("OTP sent")}catch(e){toast(e.message)}}
async function verifyOtp(phone,name){try{const code=document.getElementById("otp").value.trim();const d=await api("/api/auth/verify-otp",{method:"POST",body:JSON.stringify({phone,code,name})});A.token=d.token;A.user=d.user;A.wallet=d.wallet;localStorage.setItem("subhaToken",A.token);toast("Login successful");await boot()}catch(e){toast(e.message)}}
function go(p){A.page=p;render();window.scrollTo(0,0)}
function header(){return `<header class="top"><button class="icon" onclick="alert('Menu: Home, My Rides, Orders, Wallet, Saved Places, Support, Profile')">☰</button><button class="brand" onclick="go('home')">SUBHA <b>RIDE</b></button><button class="icon" onclick="go('notifications')">♧</button></header>`}
function nav(){return `<nav class="nav"><button class="${A.page==='home'?'active':''}" onclick="go('home')"><b>⌂</b>Home</button><button class="${A.page==='rides'?'active':''}" onclick="go('rides')"><b>🚗</b>My Rides</button><button class="${A.page==='orders'?'active':''}" onclick="go('orders')"><b>▣</b>Orders</button><button class="${A.page==='support'?'active':''}" onclick="go('support')"><b>♧</b>Support</button><button class="${A.page==='profile'?'active':''}" onclick="go('profile')"><b>●</b>Profile</button></nav>`}
function currentFare(){const v=V.find(x=>x.id===A.vehicle)||V[0];const f=A.pickup&&A.drop?v.fare+126:v.fare;return Math.max(0,f-(A.applied?50:0))}
function home(){return `<main class="page"><section class="greet"><div><div class="muted">Hello,</div><h1>${esc(A.user?.name||"Customer")}</h1><p>Where are you going today?</p></div><button class="wallet" onclick="go('wallet')"><span>Wallet Balance</span><strong>₹${Number(A.wallet).toFixed(2)}</strong><small>＋ Add Money ›</small></button></section>
<section class="location card"><div class="field"><i class="dot g"></i><label>Pickup Location<input value="${esc(A.pickup)}" oninput="A.pickup=this.value" placeholder="Enter pickup location"></label><button class="locbtn" onclick="useLocation('pickup')">⌾</button></div><div class="field"><i class="dot r"></i><label>Drop Location<input value="${esc(A.drop)}" oninput="A.drop=this.value" placeholder="Enter drop location"></label><button class="locbtn" onclick="useLocation('drop')">⌾</button></div><div class="quick"><button onclick="go('saved')">▱ Add via map</button><button onclick="go('saved')">♡ Saved Places</button></div></section>
<div class="title"><h2>Choose Vehicle</h2><button onclick="go('vehicle')">View All ›</button></div><div class="vehicles">${V.map(vehicle).join("")}</div>
<section class="fare card"><div class="farehead">▣ &nbsp;Fare Estimate</div><div class="farebody"><div class="lines"><p>Distance <span>${A.pickup&&A.drop?"12 km":"0 km"}</span></p><p>Estimated Time <span>${A.pickup&&A.drop?"35 min":"0 min"}</span></p></div><div class="total"><span>Estimated Fare</span><strong>₹${currentFare()}</strong><small>(Toll & Parking extra)</small></div></div></section>
<section class="coupon card"><div class="gift">🎁</div><div><strong>Have a coupon code?</strong><span>Apply code & save more</span></div><button onclick="coupon()">${A.applied?"Applied":"Apply Now"} ›</button></section>${A.applied?`<div class="couponinput"><input id="cp" value="SUBHA50" readonly></div>`:""}<button class="book" onclick="book()">Book Ride　›</button></main>`}
function vehicle(x){return `<button class="vehicle ${A.vehicle===x.id?"sel":""}" onclick="A.vehicle='${x.id}';render()">${A.vehicle===x.id?'<span class="tick">✓</span>':""}<div class="truck">${x.icon}</div><h3>${x.name}</h3><p>${x.desc}</p><div class="meta">♙ ${x.cap}<br>◈ ${x.load}</div><div class="vfare">₹${x.fare}<small>Estimated Fare</small></div></button>`}
function sub(title,content){return `<main class="page sub"><button class="back" onclick="go('home')">← Home</button><h1>${title}</h1>${content}</main>`}
function rides(){const rs=A.rides.length?A.rides:[ ];return sub("My Rides",rs.length?rs.map(r=>`<div class="row card"><div>🚚</div><div class="grow"><b>${esc(r.vehicle)}</b><small>${esc(r.pickup)} → ${esc(r.drop)}</small><small>${esc(r.id)}</small></div><b>₹${r.fare}<br><em class="badge">${esc(r.status)}</em></b></div>`).join(""):`<div class="empty card"><div class="big">🚚</div><h2>No rides yet</h2><p>Your completed and active rides will appear here.</p></div>`)}
function useLocation(which){if(!navigator.geolocation){toast("Location is not supported on this device");return}toast("Getting your location…");navigator.geolocation.getCurrentPosition(pos=>{const text=`Current location (${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)})`;if(which==="pickup")A.pickup=text;else A.drop=text;render()},()=>toast("Location permission was not granted"))}
function coupon(){if(A.applied)return;A.applied=true;A.coupon="SUBHA50";toast("Coupon applied — ₹50 saved");render()}
async function book(){if(!A.pickup||!A.drop){toast("Please enter pickup and drop location");return}try{const d=await api("/api/rides",{method:"POST",body:JSON.stringify({pickup:A.pickup,drop:A.drop,vehicle:A.vehicle,coupon:A.coupon,distance:12})});A.rides.unshift(d.ride);modal(d.ride)}catch(e){toast(e.message)}}
function modal(r){const m=document.createElement("div");m.className="modalbg";m.innerHTML=`<div class="modal"><div class="success">✓</div><h2>Ride requested</h2><p>We are finding a nearby driver for your ride.</p><div class="route"><b>Booking ID:</b> ${esc(r.id)}<br><br>📍 ${esc(r.pickup)}<br>↓<br>🏁 ${esc(r.drop)}<br><br><b>Estimated fare:</b> ₹${r.fare}</div><button class="book" onclick="this.closest('.modalbg').remove();go('rides')">View My Ride</button><button class="close" onclick="this.closest('.modalbg').remove()">Close</button></div>`;document.body.appendChild(m)}
async function wallet(){go("wallet")}
async function startWalletPayment(amount){
  try{
    const d=await api("/api/payments/order",{method:"POST",body:JSON.stringify({amount})});
    if(!window.Razorpay) throw Error("Payment checkout could not load");
    const rzp=new Razorpay({
      key:d.keyId,
      amount:d.order.amount,
      currency:d.order.currency,
      name:"SUBHA RIDE",
      description:"Customer Wallet Top-up",
      order_id:d.order.id,
      prefill:{name:A.user?.name||"Customer",contact:A.user?.phone||""},
      theme:{color:"#087f3d"},
      handler:async function(resp){
        try{
          const v=await api("/api/payments/verify",{method:"POST",body:JSON.stringify({
            orderId:resp.razorpay_order_id,paymentId:resp.razorpay_payment_id,
            signature:resp.razorpay_signature,amount
          })});
          A.wallet=v.balance; toast("Payment successful — wallet updated"); render();
        }catch(e){toast(e.message)}
      },
      modal:{ondismiss:function(){toast("Payment cancelled")}}
    });
    rzp.open();
  }catch(e){toast(e.message)}
}
async function walletTopup(){try{const d=await api("/api/wallet/demo-topup",{method:"POST"});A.wallet=d.balance;toast("₹500 demo credit added");render()}catch(e){toast(e.message)}}
function pageContent(){if(A.page==="home")return home();if(A.page==="rides")return rides();if(A.page==="orders")return sub("Orders",`<div class="empty card"><div class="big">📦</div><h2>No active orders</h2><p>Your delivery and shifting orders will appear here.</p></div>`);if(A.page==="support")return sub("Support",`<div class="empty card"><div class="big">🎧</div><h2>How can we help?</h2><p>Call Support · Live Chat · Help Center</p></div>`);if(A.page==="profile")return sub("Profile",`<div class="profile card"><div class="avatar">${esc((A.user?.name||"CU").slice(0,2).toUpperCase())}</div><div><b>${esc(A.user?.name||"Customer")}</b><small>${esc(A.user?.phone||"")} · SUBHA RIDE</small></div></div><button class="row card" onclick="go('wallet')">💳 <span class="grow">Wallet</span>›</button><button class="row card" onclick="go('saved')">♡ <span class="grow">Saved Places</span>›</button><button class="row card" onclick="logout()">↪ <span class="grow">Log out</span>›</button>`);if(A.page==="wallet")return sub("Wallet",`<div class="empty card"><div class="big">💳</div><p>Available Balance</p><h1 class="green">₹${Number(A.wallet).toFixed(2)}</h1><button class="book" onclick="startWalletPayment(500)">＋ Add ₹500</button>
<p class="demo">Secure payment opens Razorpay Checkout when live keys are configured.</p></div>`);if(A.page==="notifications")return sub("Notifications",`<div class="row card">🔔 <div class="grow"><b>Welcome to SUBHA RIDE</b><small>Book your first ride quickly and safely.</small></div></div>`);if(A.page==="saved")return sub("Saved Places",`${A.places.map(p=>`<button class="row card" onclick="A.pickup='${esc(p.address)}';go('home')">📍 <span class="grow"><b>${esc(p.name)}</b><small>${esc(p.address)}</small></span>›</button>`).join("")}<div class="mapbox"><div><strong>⌖</strong><span>Live map provider can be connected here.</span></div></div><button class="book" onclick="addPlace()">＋ Add Saved Place</button>`);if(A.page==="vehicle")return sub("All Vehicles",`<div class="vehicles">${V.map(vehicle).join("")}</div>`);return "";}
async function addPlace(){const name=prompt("Place name");if(!name)return;const address=prompt("Address");if(!address)return;try{const d=await api("/api/saved-places",{method:"POST",body:JSON.stringify({name,address})});A.places.push(d.place);toast("Saved place added");render()}catch(e){toast(e.message)}}
async function logout(){try{await api("/api/logout",{method:"POST"})}catch{}localStorage.removeItem("subhaToken");A.token="";login()}
function render(){document.getElementById("app").innerHTML=header()+pageContent()+nav()}
boot();
</script></body></html>
